rules:
  # 1. 广告 / 追踪拦截
  - RULE-SET,Reject,REJECT

  # 2. AI 类 → 🤖 AI 服务（默认美国节点）
  #    Gemini 在 GoogleAI 集里（gemini.google.com、aistudio.google.com 等）
  - RULE-SET,OpenAI,🤖 AI 服务
  - RULE-SET,Anthropic,🤖 AI 服务
  - RULE-SET,GoogleAI,🤖 AI 服务
  - RULE-SET,Copilot,🤖 AI 服务
  - RULE-SET,GeneralAI,🤖 AI 服务
  - RULE-SET,DeepSeek,🤖 AI 服务
  - RULE-SET,Perplexity,🤖 AI 服务
  - RULE-SET,Grok,🤖 AI 服务

  # 3. 国内品牌 → 直连
  - RULE-SET,bilibili,DIRECT
  - RULE-SET,iQIYI,DIRECT
  - RULE-SET,TencentVideo,DIRECT
  - RULE-SET,Youku,DIRECT
  - RULE-SET,MangoTV,DIRECT
  - RULE-SET,Weibo,DIRECT
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,QQ,DIRECT
  - RULE-SET,NetEaseCloudMusic,DIRECT
  - RULE-SET,QQMusic,DIRECT
  - RULE-SET,Douyin,DIRECT
  - RULE-SET,rednote,DIRECT

  # 4. 海外品牌 → 🚀 节点选择
  - RULE-SET,YouTube,🚀 节点选择
  - RULE-SET,YouTubeMusic,🚀 节点选择
  - RULE-SET,Netflix,🚀 节点选择
  - RULE-SET,DisneyPlus,🚀 节点选择
  - RULE-SET,PrimeVideo,🚀 节点选择
  - RULE-SET,Spotify,🚀 节点选择
  - RULE-SET,Telegram,🚀 节点选择
  - RULE-SET,X,🚀 节点选择
  - RULE-SET,Instagram,🚀 节点选择
  - RULE-SET,Facebook,🚀 节点选择
  - RULE-SET,WhatsApp,🚀 节点选择
  - RULE-SET,Discord,🚀 节点选择
  - RULE-SET,Reddit,🚀 节点选择
  - RULE-SET,TikTok,🚀 节点选择
  - RULE-SET,Threads,🚀 节点选择
  - RULE-SET,GitHub,🚀 节点选择
  - RULE-SET,Steam,🚀 节点选择

  # 5. 下载 / 代理类进程 → 直连（iOS 上 PROCESS-NAME 规则一般不生效，可忽略）
  - RULE-SET,Applications,DIRECT

  # 6. 局域网 / 私有地址 → 直连
  - RULE-SET,LanCIDR,DIRECT,no-resolve
  - RULE-SET,Private,DIRECT,no-resolve

  # 7. 国内域名 → 直连
  - RULE-SET,Direct,DIRECT

  # 8. 国内 IP → 直连
  - RULE-SET,CNCIDR,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,PRIVATE,DIRECT,no-resolve

  # 9. 兜底 → 🚀 节点选择
  - MATCH,🚀 节点选择

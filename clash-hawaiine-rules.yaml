# ============================================================
# Clash / Mihomo 规则库（Hawaiine/mihomo-rules）
# 来源：https://github.com/Hawaiine/mihomo-rules
#   156 品牌 · 165 规则集，每日 06:00（北京时间）从
#   v2fly / Loyalsoldier / blackmatrix7 三个上游自动同步
#
# 这是“规则库”文件：只有 rule-providers + rules 两段，
# 给 iOS Clash App 的 配置中心 → 规则库 → 添加规则 用
# （导入文件，或用下面公开链接走 URL 导入）。
#
# 它引用的策略组名必须在你用的配置里存在：
#   🚀 节点选择、🤖 AI 服务 —— 你现在的 clash-region.yaml
#   里本来就有这两个组，所以这个规则库可以直接挂在那份
#   配置上用；DIRECT、REJECT 是 Clash 内置策略，不用定义。
#
# 分流逻辑（按 Hawaiine 项目的规则匹配顺序）：
#   1. Reject（广告/追踪）→ 拦截
#   2. AI 类（OpenAI/Claude/Gemini/Copilot 等）→ 🤖 AI 服务（默认美国节点）
#      注意：Hawaiine 没有单独的 Gemini 集，Gemini 在 GoogleAI 集里
#      （gemini.google.com、aistudio.google.com 等都在内）
#   3. 国内品牌（B站、爱奇艺、微信、QQ 等）→ DIRECT
#   4. 海外品牌（YouTube、Netflix、Telegram 等）→ 🚀 节点选择
#   5. 直连类：Applications / LanCIDR / Private / Direct（国内域名）
#      / CNCIDR + GEOIP,CN（国内 IP）→ DIRECT
#   6. 兜底 MATCH → 🚀 节点选择
#
# 规则集每天自动更新（interval: 86400），不用手动维护。
# 想加别的品牌：按同样格式加一段 provider 即可，
#   url: "https://raw.githubusercontent.com/Hawaiine/mihomo-rules/main/ruleset/<品牌>/<品牌>.yaml"
#   品牌名见项目 README 的品牌分类表，如 Disney、HBO、Twitch、AppleMusic、Cursor、Poe、Doubao 等。
#
# 体积提醒：Reject（广告，约 19 万条）和 Direct（国内域名，约 11 万条）
#   是最大的两个集，首次启动下载需要一点时间；如果 iOS 端感觉卡顿
#   或自动断开，先删 Reject 这一组 provider 和它对应的规则行。
# ============================================================


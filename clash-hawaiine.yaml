# ============================================================
# Clash / Mihomo 完整配置（Hawaiine/mihomo-rules 规则库版）
# 来源：https://github.com/Hawaiine/mihomo-rules
#   156 品牌 · 165 规则集，每日 06:00（北京时间）从
#   v2fly / Loyalsoldier / blackmatrix7 三个上游自动同步
#
# 这是在原来 clash-region.yaml 的基础上，把规则部分换成
# Hawaiine 规则集的完整版：节点地区分组、AI 走美国、
# 国内直连的逻辑都没变，只是分流规则更细了。
#
# 用法：
#   1. 把下面 proxy-providers 里 YOUR_SUBSCRIPTION_URL 换成你的订阅链接
#      （只在本地替换，别发到聊天里，链接里带鉴权信息）
#   2. 导入 iOS Clash App：配置中心 → 配置库 → 添加配置 → 导入文件
#      或桌面端 Clash Verge Rev / FlClash / mihomo-party 直接导入
#   3. 节点按名字里的地区关键词自动分组；AI 类流量默认走美国节点
#
# 节点命名要求：
#   节点名里要带地区关键词才能被分进对应组，
#   如 “美国-洛杉矶01”“香港-01”“日本-东京”。如果你的节点名
#   是别的写法（比如只有编号），改下面各组 include-filter 里的正则。
#
# 规则库单独文件：clash-hawaiine-rules.yaml（只有 rule-providers + rules），
#   给 App 里 规则库 → 添加规则 用，挂在你原来的 clash-region.yaml 上也能用。
# ============================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

# 国内 DNS + 国外 DNS，避免 DNS 泄露
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip-code: cn
    geosite:
      - cn
  nameserver-policy:
    geosite:cn:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

# ---------------- 订阅 ----------------
proxy-providers:
  subscription:
    type: http
    # ↓↓↓ 把这里换成你的订阅链接 ↓↓↓
    url: "YOUR_SUBSCRIPTION_URL"
    path: ./providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ---------------- 地区策略组 ----------------
# 每个地区组用 url-test 自动测速，选延迟最低的节点
proxy-groups:
  # 总开关：手动选走哪个地区
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "🇭🇰 香港自动"
      - "🇭🇰 香港手动"
      - "🇹🇼 台湾自动"
      - "🇹🇼 台湾手动"
      - "🇯🇵 日本自动"
      - "🇯🇵 日本手动"
      - "🇸🇬 新加坡自动"
      - "🇸🇬 新加坡手动"
      - "🇺🇸 美国自动"
      - "🇺🇸 美国手动"
      - "🇬🇧 英国自动"
      - "🇬🇧 英国手动"
      - "🇰🇷 韩国自动"
      - "🇰🇷 韩国手动"
      - "🌐 其他地区自动"
      - "🌐 其他地区手动"
      - DIRECT

  - name: "🇭🇰 香港自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)港|HK|Hong Kong|HongKong"

  - name: "🇭🇰 香港手动"
    type: select
    use:
      - subscription
    filter: "(?i)港|HK|Hong Kong|HongKong"

  - name: "🇹🇼 台湾自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)台|TW|Taiwan|Taipei|台北|台中|高雄"

  - name: "🇹🇼 台湾手动"
    type: select
    use:
      - subscription
    filter: "(?i)台|TW|Taiwan|Taipei|台北|台中|高雄"

  - name: "🇯🇵 日本自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)日|JP|Japan|Tokyo|Osaka|东京|大阪"

  - name: "🇯🇵 日本手动"
    type: select
    use:
      - subscription
    filter: "(?i)日|JP|Japan|Tokyo|Osaka|东京|大阪"

  - name: "🇸🇬 新加坡自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)新加坡|狮城|SG|Singapore"

  - name: "🇸🇬 新加坡手动"
    type: select
    use:
      - subscription
    filter: "(?i)新加坡|狮城|SG|Singapore"

  - name: "🇺🇸 美国自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)美|US|America|United States|洛杉矶|旧金山|纽约|西雅图|芝加哥|达拉斯|圣何塞|拉斯维加斯|Los Angeles|San Francisco|New York|Seattle|Chicago|Dallas|San Jose|Las Vegas|California|Oregon|Virginia|Texas"

  - name: "🇺🇸 美国手动"
    type: select
    use:
      - subscription
    filter: "(?i)美|US|America|United States|洛杉矶|旧金山|纽约|西雅图|芝加哥|达拉斯|圣何塞|拉斯维加斯|Los Angeles|San Francisco|New York|Seattle|Chicago|Dallas|San Jose|Las Vegas|California|Oregon|Virginia|Texas"

  - name: "🇬🇧 英国自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)英|UK|London|伦敦|United Kingdom|Great Britain"

  - name: "🇬🇧 英国手动"
    type: select
    use:
      - subscription
    filter: "(?i)英|UK|London|伦敦|United Kingdom|Great Britain"

  - name: "🇰🇷 韩国自动"
    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    filter: "(?i)韩|KR|Korea|Seoul|首尔"

  - name: "🇰🇷 韩国手动"
    type: select

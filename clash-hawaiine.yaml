# ---------------- 规则集（Hawaiine/mihomo-rules） ----------------
# 远程 rule-provider，每天自动更新（interval: 86400）。
# 全部链接已逐个打开核实：raw.githubusercontent.com/Hawaiine/mihomo-rules/main/ruleset/<品牌>/<品牌>.yaml
# 体积提醒：Reject（约 19 万条）和 Direct（约 11 万条）最大，
# 首次启动下载需要一点时间；如果 iOS 端卡顿或自动断开，
# 先删 Reject 这一组 provider 和它对应的规则行。
rule-providers:
  # ---------- 基础规则集（6 个）----------
  Reject:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Hawaiine/mihomo-rules/main/ruleset/Reject/Reject.yaml"
    path: ./ruleset/Reject.yaml
    interval: 86400

  Direct:
    type: http

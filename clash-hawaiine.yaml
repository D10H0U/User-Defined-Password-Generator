    type: url-test
    use:
      - subscription
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
    exclude-filter: "(?i)港|HK|Hong Kong|台|TW|Taiwan|日|JP|Japan|新加坡|狮城|SG|Singapore|美|US|America|英|UK|London|韩|KR|Korea"

  - name: "🌐 其他地区手动"
    type: select
    use:
      - subscription
    include-all: true
    exclude-filter: "(?i)港|HK|Hong Kong|台|TW|Taiwan|日|JP|Japan|新加坡|狮城|SG|Singapore|美|US|America|英|UK|London|韩|KR|Korea"


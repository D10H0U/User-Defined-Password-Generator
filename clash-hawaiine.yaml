# ---------------- 分流规则 ----------------
# 按 Hawaiine 项目的匹配顺序：拦截 → 品牌 → 直连 → 国内 IP → 兜底
rules:
  # 1. 广告 / 追踪拦截
  - RULE-SET,Reject,REJECT

  # 2a. 国内 AI → DIRECT
  - RULE-SET,DeepSeek,DIRECT
  #     MiniMax、Qoder 在 GeneralAI 集里，先用单条规则截到 DIRECT，
  #     必须放在 GeneralAI 这条前面（规则按顺序命中）
  - DOMAIN-SUFFIX,minimax.io,DIRECT
  - DOMAIN-SUFFIX,qoder.com,DIRECT

  # 2b. 国外 AI → 特殊AI / 普通AI（默认美国节点）
  #     Gemini 在 GoogleAI 集里（gemini.google.com、aistudio.google.com 等）
  - RULE-SET,OpenAI,特殊AI
  - RULE-SET,Anthropic,普通AI
  - RULE-SET,GoogleAI,特殊AI
  - RULE-SET,Copilot,普通AI
  - RULE-SET,GeneralAI,普通AI
  - RULE-SET,Perplexity,普通AI
  - RULE-SET,Grok,普通AI

  # 3. 国内品牌 → DIRECT
  - RULE-SET,bilibili,DIRECT
  - RULE-SET,iQIYI,DIRECT
  - RULE-SET,TencentVideo,DIRECT
  - RULE-SET,Youku,DIRECT
  - RULE-SET,MangoTV,DIRECT
  - RULE-SET,Weibo,DIRECT
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,QQ,DIRECT
  - RULE-SET,NetEaseCloudMusic,DIRECT
  - RULE-SET,QQMusic,DIRECT
  - RULE-SET,Douyin,DIRECT
  - RULE-SET,rednote,DIRECT

  # 4. 海外品牌 → 美国（GitHub / Cloudflare / Apple / AppleUpdate / AmericanExpress 各自单独成组，组名就是集名）
  - RULE-SET,YouTube,美国
  - RULE-SET,YouTubeMusic,美国
  - RULE-SET,Netflix,美国
  - RULE-SET,DisneyPlus,美国
  - RULE-SET,PrimeVideo,美国
  - RULE-SET,Spotify,美国
  - RULE-SET,Telegram,美国
  - RULE-SET,X,美国
  - RULE-SET,Instagram,美国
  - RULE-SET,Facebook,美国
  - RULE-SET,WhatsApp,美国
  - RULE-SET,Discord,美国
  - RULE-SET,Reddit,美国
  - RULE-SET,TikTok,美国
  - RULE-SET,Threads,美国
  - RULE-SET,GitHub,GitHub
  # Apple 更新一个规则集（系统升级 + 软件更新放一起；必须放在 Apple 集前面，规则按顺序命中）
  - RULE-SET,AppleUpdate,AppleUpdate
  - RULE-SET,Apple,Apple
  - RULE-SET,Google,美国
  - RULE-SET,Cloudflare,Cloudflare
  # 金融：美国运通所有地区 → AmericanExpress 组（默认 DIRECT，可手动切到各地区）
  # （地区组已拆成自动/手动，自动组名与规则库文件引用的香港自动/新加坡自动/美国自动/其他地区自动一致）
  - RULE-SET,AmericanExpress,AmericanExpress
  - RULE-SET,Steam,美国

  # 5. 下载 / 代理类进程 → 直连（iOS 上 PROCESS-NAME 规则一般不生效，可忽略）
  - RULE-SET,Applications,DIRECT

  # 6. 局域网 / 私有地址 → 直连
  - RULE-SET,LanCIDR,DIRECT,no-resolve
  - RULE-SET,Private,DIRECT,no-resolve

  # 7. 国内域名 → 直连
  - RULE-SET,Direct,DIRECT

  # 8. 国内 IP → 直连
  - RULE-SET,CNCIDR,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,PRIVATE,DIRECT,no-resolve

  # 9. 兜底 → 🐟 漏网之鱼（默认走 🚀 节点选择）
  - MATCH,🐟 漏网之鱼
